<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sahra ticket request</title></head>
<body>
<header><span id="account"><a href="/">Sign in</a></span> | <a href="https://nova.example/" id="nova" rel="noopener">Made by Nova</a></header>
<main>
<h1 id="title">Ticket request (test page)</h1>
<p>Open this page as <code>/signup.html?party=&lt;party id&gt;</code>.</p>
<pre id="info"></pre>
<form id="signup" hidden>
<p><label>Name <input name="name" required maxlength="80"></label></p>
<p><label>Email <input name="email" type="email" required maxlength="254"></label></p>
<p><label>People <input name="people" type="number" min="1" value="1" required></label></p>
<p id="type-row" hidden><label>Ticket type <select name="type_id"></select></label></p>
<pre id="type-info"></pre>
<div id="questions"></div>
<p id="shot-row"><label>Payment screenshot <input name="screenshot" type="file" accept="image/jpeg,image/png,image/webp"></label>
 (made smaller in your browser before sending)</p>
<div id="turnstile-signup"></div>
<p><button>Request ticket</button></p>
</form>
<pre id="result" role="status"></pre>

<h2>Lost your ticket link?</h2>
<form id="resend" hidden>
<p><label>Email <input name="email" type="email" required maxlength="254"></label></p>
<div id="turnstile-resend"></div>
<p><button>Send me my link</button></p>
</form>
<pre id="resend-result" role="status"></pre>
</main>
<script src="/js/common.js"></script>
<script src="/js/signup.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=sahraTurnstileReady" async defer></script>
</body>
</html>
